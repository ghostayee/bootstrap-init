<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="bg-primary">
      <div>
        <h2 class="text-center text-white p-5">CONTAINER FLUID SECTION</h2>
      </div>
      <div>
        <p class="text-white mb-4 pb-5 px-4">
          This section uses <span class="fw-bold">.container-fluid</span>which takes full width
          of the screen
        </p>
      </div>
    </div>
    <div>
        <h2 class="text-center text-warning mt-5">WHY BOOTSTRAP</h2>
    </div>
    <div>
        <ul class="ms-5">
            <li>Saves time</li>
            <li>Minimal custom CSS needed</li>
            <li>Consistent layouts</li>
            <li>Built-in responsiveness</li>
        </ul>
    </div>
    <div>
        <button class="bg-success border-0 ms-3 mt-5"><a href="" class="text-white text-decoration-none">Learn More</a></button>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
